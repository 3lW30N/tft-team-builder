name: CI devops 2025
on:
  push:
    branches: main, dev, feat/gh-actions
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4
        run:
          git checkout feat/gh-actions

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 25
      - name: Set up JDK 25
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      #finally build your app with the latest command
      - name: Build and test with Maven
        run:
          mvn clean install
